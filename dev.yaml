substitutions:
  name: "xiaomi-rice-cooker"
  friendly_name: "Xiaomi Rice Cooker"
  # Use local components folder when compiling inside this repo
  external_components_source: "components"

packages:
  cooker: !include packages/cooker.yaml

# Device-specific secrets & networking
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: !secret fallback_ap_ssid
    password: !secret fallback_ap_password

api:
  encryption:
    key: !secret api_encryption_key
