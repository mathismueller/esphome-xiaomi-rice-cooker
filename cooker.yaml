substitutions:
  name: "xiaomi-rice-cooker"
  friendly_name: "Xiaomi Rice Cooker"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: esp8285
  board_flash_mode: qio

logger:
  hardware_uart: UART1
  baud_rate: 115200  # Outputs on GPIO2 (routed to UART2 header TX)

ota:
  - platform: esphome
    on_begin:
      - lambda: |-
          id(my_cooker).set_network_state("updating");

external_components:
  - source: components

uart:
  id: cooker_uart
  rx_pin: GPIO13
  tx_pin: GPIO15
  baud_rate: 115200

chunmi_cooker:
  id: my_cooker
  uart_id: cooker_uart
  update_interval: 3s

sensor:
  - platform: chunmi_cooker
    temperature:
      name: "Cooker Temperature"
    remaining_time:
      name: "Cooker Remaining Time"
    duration:
      name: "Cooker Program Duration"
    delay_time:
      name: "Cooker Delay Time"

text_sensor:
  - platform: chunmi_cooker
    mode:
      name: "Cooker Mode"
    stage:
      name: "Cooker Stage"
    menu:
      name: "Cooker Menu"
    last_button:
      name: "Cooker Last Button"
    last_event:
      name: "Cooker Last Event"
    hardware_version:
      name: "Cooker Hardware Version"
    mcu_version:
      name: "Cooker MCU Version"

binary_sensor:
  - platform: chunmi_cooker
    pot_present:
      name: "Inner Pot Present"
    error:
      name: "Cooker Error"
    auto_keep_warm:
      name: "Cooker Auto Keep Warm"
    lid_open_warning:
      name: "Cooker Lid Open Warning"

select:
  - platform: chunmi_cooker
    menu_select:
      name: "Cooker Menu Select"

button:
  - platform: chunmi_cooker
    cancel:
      name: "Cooker Cancel / Stop"
    acknowledge:
      name: "Cooker Acknowledge"
    mute:
      name: "Cooker Mute Warnings"
    refresh:
      name: "Cooker Refresh Status"
    start_selected_menu:
      name: "Cooker Start Selected Menu"
    start_quick_rice:
      name: "Cooker Start Quick Rice"
    start_standard_rice:
      name: "Cooker Start Standard Rice"
    start_porridge:
      name: "Cooker Start Porridge"
    start_keep_warm:
      name: "Cooker Start Keep Warm"
    start_cooking:
      name: "Cooker Start Cooking"
    start_cake:
      name: "Cooker Start Cake"

# Home Assistant Native API
api:

# Wi-Fi configuration with LED status triggers and fallback AP
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: !secret fallback_ap_ssid
    password: !secret fallback_ap_password
  on_connect:
    - lambda: |-
        id(my_cooker).set_network_state("local");
  on_disconnect:
    - lambda: |-
        id(my_cooker).set_network_state("offline");

captive_portal:

web_server:
  port: 80
