substitutions:
  name: "xiaomi-rice-cooker"
  friendly_name: "Xiaomi Rice Cooker"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: esp8285
  board_flash_mode: qio

logger:
  hardware_uart: UART1
  baud_rate: 115200 # Outputs on GPIO2 (routed to UART2 header TX)

ota:
  - platform: esphome
    encryption: # uses the same encryption as the HA API
    on_begin:
      - lambda: |-
          id(my_cooker).set_network_state("updating");

external_components:
  - source: components # local folder

uart:
  id: cooker_uart
  rx_pin: GPIO13
  tx_pin: GPIO15
  baud_rate: 115200

chunmi_cooker:
  id: my_cooker
  uart_id: cooker_uart
  update_interval: 3s

# ==============================================================================
# Controls & Program Selection
# ==============================================================================
select:
  - platform: chunmi_cooker
    menu_select:
      name: "Menu Select"

button:
  - platform: chunmi_cooker
    # --- Primary Menu & Cycle Controls ---
    start_selected_menu:
      name: "Start Selected Menu"
    cancel:
      name: "Cancel - Stop"

    # --- Quick Start Presets ---
    start_quick_rice:
      name: "Start Quick Rice"
    start_standard_rice:
      name: "Start Standard Rice"
    start_porridge:
      name: "Start Porridge"
    start_keep_warm:
      name: "Start Keep Warm"
    start_cooking:
      name: "Start Cooking"
    start_cake:
      name: "Start Cake"

    # --- Secondary Controls & Configuration ---
    acknowledge:
      name: "Acknowledge"
      entity_category: config
    mute:
      name: "Mute Warnings"
      entity_category: config
    refresh:
      name: "Refresh Status"
      entity_category: diagnostic

# ==============================================================================
# Status, Telemetry & Sensors
# ==============================================================================
sensor:
  - platform: chunmi_cooker
    # --- Primary Cooking Progress ---
    remaining_time:
      name: "Remaining Time"

    # --- Operating Sensors & Cycle Metrics ---
    temperature:
      name: "Temperature"
    duration:
      name: "Program Duration"
    delay_time:
      name: "Delay Time"

text_sensor:
  - platform: chunmi_cooker
    # --- Primary Active Status ---
    mode:
      name: "Mode"
    stage:
      name: "Stage"
    menu:
      name: "Menu"

    # --- Internal & Diagnostics ---
    last_button:
      name: "Last Button"
      entity_category: diagnostic
    last_event:
      name: "Last Event"
      entity_category: diagnostic
    hardware_version:
      name: "Hardware Version"
      entity_category: diagnostic
    mcu_version:
      name: "MCU Version"
      entity_category: diagnostic

binary_sensor:
  - platform: chunmi_cooker
    # --- Operating Status & Sensors ---
    auto_keep_warm:
      name: "Auto Keep Warm"
    lid_open_warning:
      name: "Lid Open Warning"
    # --- Hardware & Safety Sensors ---
    pot_present:
      name: "Inner Pot Present"
    error:
      name: "Error"

# Home Assistant Native API
api:
  encryption:
    key: !secret api_encryption_key

# Wi-Fi configuration with LED status triggers and fallback AP
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: !secret fallback_ap_ssid
    password: !secret fallback_ap_password
  on_connect:
    - lambda: |-
        id(my_cooker).set_network_state("local");
  on_disconnect:
    - lambda: |-
        id(my_cooker).set_network_state("offline");

# Only shown during fallback
captive_portal:
