[project]
name = "esphome-xiaomi-rice-cooker"
version = "0.1.0"
description = "Alternative local ESPHome firmware for the Xiaomi IH Rice Cooker (IHFB01CM)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Mathis Müller", email = "hello@mathismueller.eu" }
]
requires-python = ">=3.13"
dependencies = [
  "esphome",
  "esptool",
  "pyserial",
]

[project.scripts]
esphome-xiaomi-rice-cooker = "esphome_xiaomi_rice_cooker:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
