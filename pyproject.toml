[project]
name = "esphome-xiaomi-rice-cooker"
version = "0.1.0"
description = "Alternative local ESPHome firmware for the Xiaomi IH Rice Cooker (IHFB01CM)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Mathis Müller", email = "hello@mathismueller.eu" }
]
requires-python = ">=3.13"
dependencies = [
  "esphome >= 2026.9.1",
]

[dependency-groups]
dev = [
    "esptool>=5.3.1",
    "pyserial>=3.5",
]

